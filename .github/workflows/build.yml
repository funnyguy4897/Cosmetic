name: Build mod
 
on:
  push:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
 
      - name: Build DLL
        run: sh build.sh
 
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: xinput1_4
          path: xinput1_4.dll
 
